name: Build & Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v1.0.0"
        required: true
        type: string

jobs:
  docker:
    runs-on: ubuntu-latest
    environment: DOCKERHUB
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version metadata
        id: meta
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          TAG_NAME="$RELEASE_TAG"
          VERSION="${TAG_NAME#v}"

          # A workflow_dispatch from a branch produced MAJOR="master" and the
          # malformed reference "odot-dashboard:master:latest", so refuse anything
          # that is not a vX.Y.Z release tag instead of interpolating it into tags.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::ref name '$TAG_NAME' is not a vX.Y.Z release tag; nothing to publish."
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "major_minor=$MAJOR.$MINOR" >> $GITHUB_OUTPUT

          {
            echo "brgjr10/odot-dashboard:${TAG_NAME}"
            echo "brgjr10/odot-dashboard:${VERSION}"
            echo "brgjr10/odot-dashboard:${MAJOR}.${MINOR}"
            echo "brgjr10/odot-dashboard:${MAJOR}"
            echo "brgjr10/odot-dashboard:latest"
            echo "ghcr.io/brgjr10/odot-dashboard:${TAG_NAME}"
            echo "ghcr.io/brgjr10/odot-dashboard:${VERSION}"
            echo "ghcr.io/brgjr10/odot-dashboard:${MAJOR}.${MINOR}"
            echo "ghcr.io/brgjr10/odot-dashboard:${MAJOR}"
            echo "ghcr.io/brgjr10/odot-dashboard:latest"
          } > /tmp/docker-tags.txt

          echo "tags<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/docker-tags.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # docker-compose.yml advertises arm64 to CasaOS, so the image has to
          # actually exist for it; this step used to build the runner's amd64 only.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=odot-dashboard
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/brgjr10/odot-dashboard
          cache-from: type=gha
          cache-to: type=gha,mode=max
